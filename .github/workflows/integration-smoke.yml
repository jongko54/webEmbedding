name: Integration Smoke

on:
  pull_request:
    paths:
      - "bin/**"
      - "bundle/**"
      - "fixtures/frame-shadow-parity/**"
      - "python/**"
      - "scripts/check_integration_smoke.py"
      - "scripts/release_bundle.py"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/integration-smoke.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/publish.yml"
  push:
    branches:
      - "main"
    paths:
      - "bin/**"
      - "bundle/**"
      - "fixtures/frame-shadow-parity/**"
      - "python/**"
      - "scripts/check_integration_smoke.py"
      - "scripts/release_bundle.py"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/integration-smoke.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  integration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Run integration smoke
        run: python3 scripts/check_integration_smoke.py

      - name: Run exact reuse score gate
        run: npm run check:clone-score-gate:local
