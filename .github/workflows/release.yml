name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Build release assets
        run: python3 scripts/release_bundle.py

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/source-first-clone-bundle.tar.gz
            dist/install.py
            dist/install.sh
            dist/SHA256SUMS
