name: Benchmark Regression

on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  universal-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run universal benchmark corpus
        run: |
          python scripts/benchmark_routes.py \
            --urls-file docs/universal-benchmark-corpus.txt \
            --out ./.tmp/universal-benchmark

      - name: Validate benchmark expectations
        run: |
          python scripts/check_benchmark_report.py \
            --report ./.tmp/universal-benchmark/universal-route-report.json \
            --expectations docs/universal-benchmark-expectations.json

      - name: Validate benchmark evidence
        run: |
          python scripts/check_benchmark_evidence.py

      - name: Run operational smoke checks
        run: |
          python scripts/check_job_queue_smoke.py
          python scripts/check_har_replay_smoke.py
          python scripts/benchmark_authenticated_corpus.py \
            --manifest docs/authenticated-dashboard-corpus.example.json \
            --validate-only \
            --out ./.tmp/authenticated-dashboard-corpus-validate

      - name: Validate production readiness gates
        run: |
          python scripts/check_production_readiness.py \
            --report ./.tmp/universal-benchmark/universal-route-report.json

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: universal-benchmark-report-py${{ matrix.python-version }}
          path: ./.tmp/universal-benchmark/universal-route-report.json
          if-no-files-found: ignore
